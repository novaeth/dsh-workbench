name: desktop-smoke

"on":
  workflow_dispatch:
  push:
    branches: [desktop-smoke]
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

concurrency:
  group: desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: desktop / windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      HUSKY: 0
      DESKTOP_WORKBENCH_SPEC: '@dsh-workbench/core@beta'
    steps:
      - uses: actions/checkout@v4
      - name: Install Desktop
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'dsh-desktop-win.exe'
          Invoke-WebRequest -Uri 'https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe' -OutFile $installer
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer failed: $($install.ExitCode)" }
          Start-Sleep -Seconds 10
          $exe = Get-ChildItem -Path @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}") -Filter 'DeepSeek Harness.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $exe) { throw 'DeepSeek Harness.exe not found' }
          "DESKTOP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_CLI=$(Join-Path $exe.DirectoryName 'resources\runtime\cli\bin\dsh.cmd')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Assert default user has no opencli
        shell: pwsh
        run: |
          if (Get-Command opencli -ErrorAction SilentlyContinue) { throw 'opencli is preinstalled; this smoke must start without it' }
          'opencli: missing (expected)'
      - name: Initialize Desktop profile
        shell: pwsh
        run: |
          $p = Start-Process -FilePath $env:DESKTOP_EXE -PassThru
          Start-Sleep -Seconds 25
          Get-Process | Where-Object { $_.ProcessName -like '*DeepSeek*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Get-Content "$env:USERPROFILE\.dsh\profiles\desktop\package.json" -Raw
      - name: Install workbench from plugin page, wait for the gate, assert panel
        shell: pwsh
        run: |
          Start-Transcript -Path desktop-win-ui.txt -Force
          $env:npm_config_registry = 'https://registry.npmmirror.com'
          $env:NPM_CONFIG_REGISTRY = $env:npm_config_registry
          "registry: $env:NPM_CONFIG_REGISTRY"
          $out = Join-Path $env:RUNNER_TEMP 'desktop-win-app.log'
          $err = Join-Path $env:RUNNER_TEMP 'desktop-win-app.err.log'
          $p = Start-Process -FilePath $env:DESKTOP_EXE -ArgumentList '--remote-debugging-port=9222' -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 60
          Get-Content $out, $err -ErrorAction SilentlyContinue
          $cdp = Join-Path $env:GITHUB_WORKSPACE 'desktop-win-cdp.txt'
          & node scripts/desktop-smoke/cdp-probe.mjs 9222 desktop-win.png --install-via-ui --expect-workbench *> $cdp
          $code = $LASTEXITCODE
          Get-Content $cdp -ErrorAction SilentlyContinue
          Stop-Transcript
          if ($code -ne 0) { throw "cdp probe failed: $code" }
      - name: Assert opencli installed
        shell: pwsh
        run: |
          $root = "$env:USERPROFILE\.dsh\workbench\opencli"
          $manifest = Join-Path $root 'toolchain\node_modules\@jackwener\opencli\package.json'
          if (!(Test-Path $manifest)) { throw "opencli missing: $manifest" }
          $version = (Get-Content $manifest -Raw | ConvertFrom-Json).version
          "opencli $version"
          $bin = Join-Path $root 'bin\opencli.cmd'
          if (!(Test-Path $bin)) { throw "opencli bin missing: $bin" }
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw "opencli --version failed: $LASTEXITCODE" }
      - name: Inspect workbench install
        if: always()
        shell: pwsh
        run: |
          Start-Transcript -Path desktop-win-inspect.txt -Force
          try {
            $root = "$env:USERPROFILE\.dsh\workbench"
            "workbench root: $root"
            if (Test-Path $root) { Get-ChildItem $root -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 400 }
            $opencli = @("$root\opencli", "$root\opencli\toolchain", "$root\opencli\bin")
            foreach ($dir in $opencli) {
              "== $dir"
              if (Test-Path $dir) { Get-ChildItem $dir -Force -ErrorAction SilentlyContinue | Select-Object Name } else { 'missing' }
            }
            "== seed.log"
            Get-Content "$root\seed.log" -ErrorAction SilentlyContinue
            "== profile patch"
            Get-Content "$env:USERPROFILE\.dsh\profiles\desktop\cordis.patch.yml" -ErrorAction SilentlyContinue
            "== app stdout"
            Get-Content (Join-Path $env:RUNNER_TEMP 'desktop-win-app.log') -ErrorAction SilentlyContinue | Select-Object -Last 200
          } finally { Stop-Transcript }
      - name: Stop Desktop
        if: always()
        shell: pwsh
        run: Get-Process | Where-Object { $_.ProcessName -like '*DeepSeek*' } | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Commit probe log
        if: always()
        shell: bash
        run: |
          git config user.name ci
          git config user.email ci@example.com
          shopt -s nullglob
          files=(desktop-win*.png desktop-win*.txt)
          if [ ${#files[@]} -gt 0 ]; then
            git add -f "${files[@]}"
            git commit -m "ci: windows desktop ui probe [skip ci]" || true
          fi
          git push origin HEAD:desktop-ui-log-win-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-windows
          path: |
            desktop-win.png
            desktop-win-gate.png
            desktop-win-gate-open.png
            desktop-win-cdp.txt
            desktop-win-ui.txt
            desktop-win-inspect.txt

  macos:
    name: desktop / macos arm64
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HUSKY: 0
      DESKTOP_WORKBENCH_SPEC: '@dsh-workbench/core@beta'
    steps:
      - uses: actions/checkout@v4
      - name: Install Desktop
        shell: bash
        run: |
          curl -fL --retry 2 -o "$RUNNER_TEMP/dsh-desktop-mac.dmg" "https://download.deepseek.com/desktop/dsh-latest-macos-arm64.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dsh-mnt" "$RUNNER_TEMP/dsh-desktop-mac.dmg"
          cp -R "$RUNNER_TEMP/dsh-mnt/DeepSeek Harness.app" /Applications/
          hdiutil detach "$RUNNER_TEMP/dsh-mnt"
          xattr -dr com.apple.quarantine '/Applications/DeepSeek Harness.app'
      - name: Assert default user has no opencli
        shell: bash
        run: |
          if command -v opencli >/dev/null 2>&1; then echo "unexpected opencli: $(command -v opencli)"; exit 1; fi
          echo 'opencli: missing (expected)'
      - name: Initialize Desktop profile
        shell: bash
        run: |
          pkill -f 'DeepSeek Harness' 2>/dev/null || true
          '/Applications/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness' > "$RUNNER_TEMP/desktop-mac-init.log" 2>&1 &
          sleep 25
          pkill -f 'DeepSeek Harness' 2>/dev/null || true
          sleep 3
          cat "$HOME/.dsh/profiles/desktop/package.json"
      - name: Install workbench from plugin page, wait for the gate, assert panel
        shell: bash
        run: |
          exec > >(tee desktop-mac-ui.txt) 2>&1
          export npm_config_registry='https://registry.npmmirror.com'
          export NPM_CONFIG_REGISTRY="$npm_config_registry"
          echo "registry: $NPM_CONFIG_REGISTRY"
          pkill -f 'DeepSeek Harness' 2>/dev/null || true
          sleep 3
          cd /
          pwd
          '/Applications/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness' --remote-debugging-port=9222 > "$RUNNER_TEMP/desktop-mac-app.log" 2>&1 &
          sleep 60
          cat "$RUNNER_TEMP/desktop-mac-app.log"
          ( cd "$GITHUB_WORKSPACE" && node scripts/desktop-smoke/cdp-probe.mjs 9222 desktop-mac.png --install-via-ui --expect-workbench )
      - name: Assert opencli installed
        shell: bash
        run: |
          root="$HOME/.dsh/workbench/opencli"
          manifest="$root/toolchain/node_modules/@jackwener/opencli/package.json"
          if [ ! -f "$manifest" ]; then
            echo "opencli missing: $manifest"
            exit 1
          fi
          node -e "const p=require('$manifest'); console.log('opencli', p.version)"
          if [ ! -x "$root/bin/opencli" ]; then
            echo "opencli bin missing: $root/bin/opencli"
            exit 1
          fi
          "$root/bin/opencli" --version
      - name: Inspect workbench install
        if: always()
        shell: bash
        run: |
          exec > >(tee desktop-mac-inspect.txt) 2>&1
          echo '--- workbench tree ---'
          find "$HOME/.dsh/workbench" -maxdepth 4 -print 2>/dev/null | head -150 || true
          echo '--- opencli tree ---'
          find "$HOME/.dsh/workbench/opencli" -maxdepth 4 -print 2>/dev/null | head -80 || true
          echo '--- seed log ---'
          cat "$HOME/.dsh/workbench/seed.log" 2>/dev/null || true
          echo '--- desktop profile patch ---'
          cat "$HOME/.dsh/profiles/desktop/cordis.patch.yml" 2>/dev/null || true
          echo '--- app stdout ---'
          cat "$RUNNER_TEMP/desktop-mac-app.log" 2>/dev/null | tail -300 || true
          echo '--- library logs ---'
          find "$HOME/Library/Logs/DeepSeek Harness" -type f 2>/dev/null | while read -r file; do
            echo "=== $file"
            tail -200 "$file" 2>/dev/null || true
          done || true
      - name: Stop Desktop
        if: always()
        shell: bash
        run: pkill -f 'DeepSeek Harness' 2>/dev/null || true
      - name: Commit probe log
        if: always()
        shell: bash
        run: |
          git config user.name ci
          git config user.email ci@example.com
          shopt -s nullglob
          files=(desktop-mac*.png desktop-mac*.txt)
          if [ ${#files[@]} -gt 0 ]; then
            git add -f "${files[@]}"
            git commit -m "ci: macos desktop ui probe [skip ci]" || true
          fi
          git push origin HEAD:desktop-ui-log-mac-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-macos
          path: |
            desktop-mac.png
            desktop-mac-gate.png
            desktop-mac-gate-open.png
            desktop-mac-ui.txt
            desktop-mac-inspect.txt
