name: desktop-smoke

"on":
  workflow_dispatch:
  push:
    branches: [desktop-smoke]
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

concurrency:
  group: desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: desktop / windows x64
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      HUSKY: 0
      DESKTOP_SMOKE_OS: win
      DESKTOP_SMOKE_MARKET: https://github.com/novaeth/dsh-workbench-market.git
      DESKTOP_SMOKE_MODULE: '@dsh-workbench/module-hello'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install build deps (immutable)
        run: pnpm install --frozen-lockfile
      - name: Build local workbench (except docs)
        run: pnpm --filter "./packages/*" --filter "!@dsh-workbench/docs" --if-present run build
      - name: Install Desktop
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'dsh-desktop-win.exe'
          Invoke-WebRequest -Uri 'https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe' -OutFile $installer
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer failed: $($install.ExitCode)" }
          Start-Sleep -Seconds 10
          $exe = Get-ChildItem -Path @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}") -Filter 'DeepSeek Harness.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $exe) { throw 'DeepSeek Harness.exe not found' }
          "DESKTOP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Assert default user has no opencli
        shell: pwsh
        run: |
          if (Get-Command opencli -ErrorAction SilentlyContinue) { throw 'opencli is preinstalled; this smoke must start without it' }
          'opencli: missing (expected)'
      - name: Open Desktop, install workbench and market module, restart once
        shell: pwsh
        env:
          DESKTOP_WORKBENCH_SPEC: ${{ github.workspace }}\packages\core
          DESKTOP_SMOKE_OUT: ${{ github.workspace }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'desktop-win-app.log'
          $err = Join-Path $env:RUNNER_TEMP 'desktop-win-app.err.log'
          $out2 = Join-Path $env:RUNNER_TEMP 'desktop-win-app2.log'
          $err2 = Join-Path $env:RUNNER_TEMP 'desktop-win-app2.err.log'
          "DESKTOP_SMOKE_APP_LOG=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_SMOKE_APP_ERR=$err" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_SMOKE_APP_LOG_2=$out2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_SMOKE_APP_ERR_2=$err2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $app = Start-Process -FilePath $env:DESKTOP_EXE -ArgumentList '--remote-debugging-port=9222' -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          "desktop pid: $($app.Id)"
          & node scripts/desktop-smoke/cdp-probe.mjs 9222 desktop-win.png --install-via-ui
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "cdp probe failed: $code" }
          Get-Process | Where-Object { $_.ProcessName -like '*DeepSeek*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $app2 = Start-Process -FilePath $env:DESKTOP_EXE -ArgumentList '--remote-debugging-port=9223' -RedirectStandardOutput $out2 -RedirectStandardError $err2 -PassThru
          "restarted desktop pid: $($app2.Id)"
          & node scripts/desktop-smoke/cdp-probe.mjs 9223 desktop-win-after-restart.png --verify-only --expect-workbench
          $code2 = $LASTEXITCODE
          if ($code2 -ne 0) { throw "cdp verify probe failed: $code2" }
      - name: Assert opencli installed
        shell: pwsh
        run: |
          $root = "$env:USERPROFILE\.dsh\workbench\opencli"
          $manifest = Join-Path $root 'toolchain\node_modules\@jackwener\opencli\package.json'
          if (!(Test-Path $manifest)) { throw "opencli missing: $manifest" }
          $version = (Get-Content $manifest -Raw | ConvertFrom-Json).version
          "opencli $version"
          $bin = Join-Path $root 'bin\opencli.cmd'
          if (!(Test-Path $bin)) { throw "opencli bin missing: $bin" }
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw "opencli --version failed: $LASTEXITCODE" }
      - name: Assert module installed
        shell: pwsh
        run: |
          $env:SMOKE_MANIFEST = "$env:USERPROFILE\.dsh\profiles\desktop\package.json"
          node -e "
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.env.SMOKE_MANIFEST, 'utf8'));
          const name = '@dsh-workbench/module-hello';
          const spec = (manifest.dependencies ?? {})[name];
          const bundles = (manifest.dsh && manifest.dsh.profile && manifest.dsh.profile.bundles) || [];
          if (spec === undefined && !bundles.includes(name)) throw new Error('module-hello 没进 profile');
          console.log('module-hello', spec ?? 'bundle');
          "
      - name: Collect diagnostics
        if: always()
        shell: bash
        env:
          DESKTOP_SMOKE_STATUS: ${{ job.status }}
        run: node scripts/desktop-smoke/collect.mjs
      - name: Stop Desktop
        if: always()
        shell: pwsh
        run: Get-Process | Where-Object { $_.ProcessName -like '*DeepSeek*' } | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Publish logs
        if: always()
        shell: bash
        run: |
          git config user.name ci
          git config user.email ci@example.com
          shopt -s nullglob
          files=(desktop-win*.png desktop-win*.txt desktop-win*.json desktop-win*.log)
          if [ ${#files[@]} -gt 0 ]; then
            git add -f "${files[@]}"
            git commit -m "ci: windows desktop smoke log [skip ci]" || true
          fi
          git push origin HEAD:desktop-ui-log-win-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-windows
          if-no-files-found: warn
          path: |
            desktop-win*.png
            desktop-win*.txt
            desktop-win*.json
            desktop-win*.log

  macos:
    name: desktop / macos arm64
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      HUSKY: 0
      DESKTOP_SMOKE_OS: mac
      DESKTOP_SMOKE_MARKET: https://github.com/novaeth/dsh-workbench-market.git
      DESKTOP_SMOKE_MODULE: '@dsh-workbench/module-hello'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install build deps (immutable)
        run: pnpm install --frozen-lockfile
      - name: Build local workbench (except docs)
        run: pnpm --filter "./packages/*" --filter "!@dsh-workbench/docs" --if-present run build
      - name: Install Desktop
        shell: bash
        run: |
          curl -fL --retry 2 -o "$RUNNER_TEMP/dsh-desktop-mac.dmg" "https://download.deepseek.com/desktop/dsh-latest-macos-arm64.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dsh-mnt" "$RUNNER_TEMP/dsh-desktop-mac.dmg"
          cp -R "$RUNNER_TEMP/dsh-mnt/DeepSeek Harness.app" /Applications/
          hdiutil detach "$RUNNER_TEMP/dsh-mnt"
          xattr -dr com.apple.quarantine '/Applications/DeepSeek Harness.app'
      - name: Assert default user has no opencli
        shell: bash
        run: |
          if command -v opencli >/dev/null 2>&1; then echo "unexpected opencli: $(command -v opencli)"; exit 1; fi
          echo 'opencli: missing (expected)'
      - name: Open Desktop, install workbench and market module, restart once
        shell: bash
        env:
          DESKTOP_WORKBENCH_SPEC: ${{ github.workspace }}/packages/core
          DESKTOP_SMOKE_OUT: ${{ github.workspace }}
        run: |
          {
            echo "DESKTOP_SMOKE_APP_LOG=$RUNNER_TEMP/desktop-mac-app.log"
            echo "DESKTOP_SMOKE_APP_ERR=$RUNNER_TEMP/desktop-mac-app.err.log"
          } >> "$GITHUB_ENV"
          pkill -f 'DeepSeek Harness' 2>/dev/null || true
          sleep 2
          cd /
          '/Applications/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness' --remote-debugging-port=9222 > "$RUNNER_TEMP/desktop-mac-app.log" 2> "$RUNNER_TEMP/desktop-mac-app.err.log" &
          node "$GITHUB_WORKSPACE/scripts/desktop-smoke/cdp-probe.mjs" 9222 desktop-mac.png --install-via-ui
          pkill -f 'DeepSeek Harness' 2>/dev/null || true
          sleep 3
          '/Applications/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness' --remote-debugging-port=9223 >> "$RUNNER_TEMP/desktop-mac-app.log" 2>> "$RUNNER_TEMP/desktop-mac-app.err.log" &
          node "$GITHUB_WORKSPACE/scripts/desktop-smoke/cdp-probe.mjs" 9223 desktop-mac-after-restart.png --verify-only --expect-workbench
      - name: Assert opencli installed
        shell: bash
        run: |
          root="$HOME/.dsh/workbench/opencli"
          manifest="$root/toolchain/node_modules/@jackwener/opencli/package.json"
          if [ ! -f "$manifest" ]; then
            echo "opencli missing: $manifest"
            exit 1
          fi
          node -e "const p=require('$manifest'); console.log('opencli', p.version)"
          if [ ! -x "$root/bin/opencli" ]; then
            echo "opencli bin missing: $root/bin/opencli"
            exit 1
          fi
          "$root/bin/opencli" --version
      - name: Assert module installed
        shell: bash
        run: |
          node -e "
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.env.HOME + '/.dsh/profiles/desktop/package.json', 'utf8'));
          const name = '@dsh-workbench/module-hello';
          const spec = (manifest.dependencies ?? {})[name];
          const bundles = (manifest.dsh && manifest.dsh.profile && manifest.dsh.profile.bundles) || [];
          if (spec === undefined && !bundles.includes(name)) throw new Error('module-hello 没进 profile');
          console.log('module-hello', spec ?? 'bundle');
          "
      - name: Collect diagnostics
        if: always()
        shell: bash
        env:
          DESKTOP_SMOKE_STATUS: ${{ job.status }}
        run: node scripts/desktop-smoke/collect.mjs
      - name: Stop Desktop
        if: always()
        shell: bash
        run: pkill -f 'DeepSeek Harness' 2>/dev/null || true
      - name: Publish logs
        if: always()
        shell: bash
        run: |
          git config user.name ci
          git config user.email ci@example.com
          shopt -s nullglob
          files=(desktop-mac*.png desktop-mac*.txt desktop-mac*.json desktop-mac*.log)
          if [ ${#files[@]} -gt 0 ]; then
            git add -f "${files[@]}"
            git commit -m "ci: macos desktop smoke log [skip ci]" || true
          fi
          git push origin HEAD:desktop-ui-log-mac-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-macos
          if-no-files-found: warn
          path: |
            desktop-mac*.png
            desktop-mac*.txt
            desktop-mac*.json
            desktop-mac*.log
