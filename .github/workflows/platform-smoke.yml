name: platform-smoke

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**/src/**'
      - 'packages/**/scripts/**'
      - 'packages/**/bin/**'
      - 'package.json'
      - '.husky/**'
      - 'scripts/**'
      - '.github/workflows/platform-smoke.yml'
  pull_request:
    paths:
      - 'packages/**/src/**'
      - 'packages/**/scripts/**'
      - 'packages/**/bin/**'
      - 'package.json'
      - '.husky/**'
      - 'scripts/**'
      - '.github/workflows/platform-smoke.yml'
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: platform-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: mac
          - os: windows-latest
            label: win-2025
          - os: windows-2022
            label: win-2022
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (immutable)
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Build (except docs)
        shell: bash
        run: pnpm --filter "./packages/*" --filter "!@dsh-workbench/docs" --if-present run build
      - name: Assert pwsh (win32 引号往返要靠它)
        if: runner.os != 'Windows'
        shell: bash
        run: command -v pwsh
      - name: Platform smoke (argv quoting / timeout / append)
        shell: bash
        run: node scripts/smoke/platform-shell.mjs
      - name: Install plan smoke (真 shell 跑 run → remove → mkdir → copy → link → optional → env)
        shell: bash
        run: node scripts/smoke/install-plan.mjs
      - name: Runtime heal smoke (升级现场：既有 store 记录 + 断链 → store 不合 → 清一次重装)
        shell: bash
        run: |
          set -o pipefail
          if ! node scripts/smoke/runtime-heal.mjs > heal.log 2>&1; then
            tail -n 30 heal.log
            body=$(grep -aE '❌|没过' heal.log | head -n 10 | sed -e 's/%/%25/g' | awk 'NF { printf "%s%%0A", $0 }')
            echo "::error title=runtime heal smoke failed::${body:0:1800}"
            exit 1
          fi
          tail -n 3 heal.log
      - name: 自更新与自愈的判据（win32 的 $ComSpec / taskkill 分支在各腿上真跑）
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm --filter @dsh-workbench/adapter-probe exec vitest run \
            src/__tests__/self-update.test.ts \
            src/__tests__/self-update-steps.test.ts \
            src/__tests__/self-update-boot.test.ts \
            src/__tests__/version-dir.test.ts \
            src/__tests__/version-switch.test.ts \
            src/__tests__/version-migrate.test.ts \
            src/__tests__/isolated-install.test.ts > vitest.log 2>&1; then
            tail -n 40 vitest.log
            body=$(grep -aE 'FAIL |× |→ ' vitest.log | head -n 25 || tail -n 12 vitest.log)
            body=$(printf '%s\n' "$body" | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'NF { printf "%s%%0A", $0 }')
            echo "::error title=self-update criteria failed::${body:0:1800}"
            exit 1
          fi
          tail -n 5 vitest.log
      - name: 换版本不就地覆盖（四条腿真跑：真目录→链接 · 旧目录不动 · 坏版本不回退错 · 回退不重装）
        shell: bash
        run: node scripts/smoke/self-update-links.mjs
      - name: Renderer + seam tests
        shell: bash
        run: pnpm --filter @dsh-workbench/shared exec vitest run src/host/__tests__/shell-render.test.ts src/host/__tests__/seam.test.ts src/host/seam/__tests__/process.test.ts
      - name: Capture controller tests
        shell: bash
        run: pnpm --filter @dsh-workbench/core exec vitest run src/modules/panels/model/__tests__/diy-record-live.test.ts
      - name: Browser read tests
        shell: bash
        run: pnpm --filter @dsh-workbench/adapter-runtime exec vitest run src/browser/__tests__/browser-read.test.ts
      - name: Selfcheck (core)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm --filter @dsh-workbench/core run selfcheck > selfcheck.log 2>&1; then
            tail -n 25 selfcheck.log
            body=$(grep -aE '❌|通过 —— 失败' selfcheck.log || tail -n 8 selfcheck.log)
            body=$(printf '%s\n' "$body" | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'NF { printf "%s%%0A", $0 }')
            echo "::error title=selfcheck failed::${body:0:1800}"
            exit 1
          fi
          tail -n 3 selfcheck.log

      - name: Selfcheck (core, 执行层那几条)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          only='起 shell 的写法|POSIX-only|执行缝只有一条路|每次执行缝调用都声明写入域|沙箱拒绝不被吞|起进程只有一个入口|宿主能力只在宿主接线里打开|宿主文件写只有一个入口|受控 env 只在 env-policy'
          if ! node packages/core/scripts/selfcheck/index.mjs --only "$only" > selfcheck.log 2>&1; then
            tail -n 25 selfcheck.log
            body=$(grep -aE '❌|通过 —— 失败' selfcheck.log || tail -n 8 selfcheck.log)
            body=$(printf '%s\n' "$body" | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'NF { printf "%s%%0A", $0 }')
            echo "::error title=selfcheck (exec layer) failed::${body:0:1800}"
            exit 1
          fi
          tail -n 3 selfcheck.log
