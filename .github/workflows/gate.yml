name: gate

"on":
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * 1'

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: full gate / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: mac
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Full gate (整条链，与本地 `pnpm run check` 同一条)
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm -w run check > gate.log 2>&1; then
            tail -n 80 gate.log
            body=$(grep -aE '✖|error TS|FAIL|Failed|失败|ELIFECYCLE' gate.log | tail -n 14 | sed -e 's/%/%25/g' | awk 'NF { printf "%s%%0A", $0 }')
            echo "::error title=gate failed::${body:0:1800}"
            exit 1
          fi
          tail -n 3 gate.log
