name: desktop-smoke-windows

"on":
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      label:
        type: string
        required: true

permissions:
  contents: write

jobs:
  smoke:
    name: desktop / windows (${{ inputs.label }})
    runs-on: ${{ inputs.image }}
    timeout-minutes: 25
    env:
      HUSKY: 0
      DESKTOP_SMOKE_OS: ${{ inputs.label }}
      DESKTOP_SMOKE_MARKET: https://github.com/novaeth/dsh-workbench-market.git
      DESKTOP_SMOKE_MODULE: '@dsh-workbench/module-hello'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install build deps (immutable)
        run: pnpm install --frozen-lockfile
      - name: Build local workbench (except docs)
        run: pnpm --filter "./packages/*" --filter "!@dsh-workbench/docs" --if-present run build
      - name: Install Desktop
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'dsh-desktop-${{ inputs.label }}.exe'
          Invoke-WebRequest -Uri 'https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe' -OutFile $installer
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer failed: $($install.ExitCode)" }
          Start-Sleep -Seconds 10
          $exe = Get-ChildItem -Path @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}") -Filter 'DeepSeek Harness.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $exe) { throw 'DeepSeek Harness.exe not found' }
          "DESKTOP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Assert default user has no opencli
        shell: pwsh
        run: |
          if (Get-Command opencli -ErrorAction SilentlyContinue) { throw 'opencli is preinstalled; this smoke must start without it' }
          'opencli: missing (expected)'
      - name: Prepare opencli browser extension
        run: node scripts/desktop-smoke/prepare-browser.mjs
      - name: Open Desktop, install workbench and market module, restart once
        shell: pwsh
        env:
          DESKTOP_WORKBENCH_SPEC: ${{ github.workspace }}\packages\core
          DESKTOP_SMOKE_OUT: ${{ github.workspace }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app.log'
          $err = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app.err.log'
          $out2 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app2.log'
          $err2 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app2.err.log'
          $out3 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app3.log'
          $err3 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app3.err.log'
          $out4 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app4.log'
          $err4 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app4.err.log'
          "DESKTOP_SMOKE_APP_LOG=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_SMOKE_APP_ERR=$err" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_SMOKE_APP_LOG_2=$out2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_SMOKE_APP_ERR_2=$err2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          function Stop-App {
            Get-Process | Where-Object { $_.ProcessName -like '*DeepSeek*' } | Stop-Process -Force -ErrorAction SilentlyContinue
            for ($i = 0; $i -lt 30; $i++) {
              $left = Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like '*DeepSeek*' }
              if ($null -eq $left) { return }
              Start-Sleep -Seconds 1
            }
          }
          function Start-App([int]$port, [string]$log, [string]$logErr) {
            Start-Process -FilePath $env:DESKTOP_EXE -ArgumentList "--remote-debugging-port=$port" -RedirectStandardOutput $log -RedirectStandardError $logErr -PassThru
          }
          function Invoke-Logged([string]$label, [scriptblock]$what) {
            $log = Join-Path $env:RUNNER_TEMP "$label.log"
            & $what *> $log
            if ($LASTEXITCODE -ne 0) {
              Get-Content $log -Tail 30 | Write-Host
              $body = ((Get-Content $log -Tail 30) | Where-Object { $_ -ne '' } | ForEach-Object { ($_ -replace '%', '%25') + '%0A' }) -join ''
              Write-Host "::error title=$label failed::$body"
              throw "$label failed"
            }
          }
          function Invoke-Warned([string]$label, [scriptblock]$what) {
            $log = Join-Path $env:RUNNER_TEMP "$label.log"
            & $what *> $log
            if ($LASTEXITCODE -eq 0) { return $true }
            Get-Content $log -Tail 20 | Write-Host
            $body = ((Get-Content $log -Tail 20) | Where-Object { $_ -ne '' } | ForEach-Object { ($_ -replace '%', '%25') + '%0A' }) -join ''
            Write-Host "::warning title=$label (回退 E2E 试验中，不挡这条腿)::$body"
            $global:LASTEXITCODE = 0
            return $false
          }
          function Wait-Page([int]$port) {
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $json = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/json" -TimeoutSec 2
                if ($json.Content -match '"type": ?"page"') { return $true }
              } catch { }
              Start-Sleep -Seconds 1
            }
            return $false
          }
          Stop-App
          Start-Sleep -Seconds 2
          $app = Start-App 9222 $out $err
          "desktop pid: $($app.Id)"
          if (-not (Wait-Page 9222)) { throw 'first instance produced no page' }
          Invoke-Logged 'probe-install' { node scripts/desktop-smoke/cdp-probe.mjs 9222 desktop-${{ inputs.label }}.png --install-via-ui }
          Stop-App
          Start-Sleep -Seconds 3
          $app2 = Start-App 9223 $out2 $err2
          "restarted desktop pid: $($app2.Id)"
          if (-not (Wait-Page 9223)) {
            'restart produced no page; trying once more'
            Stop-App
            Start-Sleep -Seconds 3
            $app2 = Start-App 9223 $out2 $err2
            if (-not (Wait-Page 9223)) { throw 'restart still produced no page' }
          }
          Invoke-Logged 'probe-after-restart' { node scripts/desktop-smoke/cdp-probe.mjs 9223 desktop-${{ inputs.label }}-after-restart.png --verify-only --expect-workbench }
          # 回退这条 E2E 还在试验中：它自己红只发警告，不挡这条腿既有的信号。
          # pwsh 会把最后一条原生命令的退出码留到步骤末尾，所以每处告警后都把它抹平。
          $appRoot = Join-Path $env:USERPROFILE '.dsh'
          if (Invoke-Warned 'rollback-fixture' { node scripts/desktop-smoke/self-update-rollback-fixture.mjs $appRoot 'desktop' 1.2.3-beta.2 }) {
            Stop-App
            Start-Sleep -Seconds 3
            $app3 = Start-App 9224 $out3 $err3
            if (Wait-Page 9224) {
              if (Invoke-Warned 'probe-rollback' { node scripts/desktop-smoke/cdp-probe.mjs 9224 desktop-${{ inputs.label }}-rollback.png --self-update-rollback }) {
                Stop-App
                Start-Sleep -Seconds 3
                $app4 = Start-App 9225 $out4 $err4
                if (Wait-Page 9225) {
                  Invoke-Warned 'probe-after-rollback' { node scripts/desktop-smoke/cdp-probe.mjs 9225 desktop-${{ inputs.label }}-after-rollback.png --verify-only --expect-workbench } | Out-Null
                } else {
                  Write-Host '::warning title=post-rollback instance (回退 E2E 试验中，不挡这条腿)::重启后没有页面'
                }
              }
            } else {
              Write-Host '::warning title=rollback instance (回退 E2E 试验中，不挡这条腿)::启动后没有页面'
            }
          }
          $global:LASTEXITCODE = 0
      - name: Assert opencli installed
        shell: pwsh
        run: |
          $root = "$env:USERPROFILE\.dsh\workbench\opencli"
          $manifest = Join-Path $root 'toolchain\node_modules\@jackwener\opencli\package.json'
          $bin = Join-Path $root 'bin\opencli.cmd'
          $deadline = (Get-Date).AddSeconds(180)
          while (!((Test-Path $manifest) -and (Test-Path $bin))) {
            if ((Get-Date) -gt $deadline) {
              throw "opencli missing after 180s: manifest=$(Test-Path $manifest) bin=$(Test-Path $bin)"
            }
            Start-Sleep -Seconds 5
          }
          $version = (Get-Content $manifest -Raw | ConvertFrom-Json).version
          "opencli $version"
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw "opencli --version failed: $LASTEXITCODE" }
      - name: Assert module installed
        shell: pwsh
        run: |
          $env:SMOKE_MANIFEST = "$env:USERPROFILE\.dsh\profiles\desktop\package.json"
          node -e "
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.env.SMOKE_MANIFEST, 'utf8'));
          const name = '@dsh-workbench/module-hello';
          const spec = (manifest.dependencies ?? {})[name];
          const bundles = (manifest.dsh && manifest.dsh.profile && manifest.dsh.profile.bundles) || [];
          if (spec === undefined && !bundles.includes(name)) throw new Error('module-hello 没进 profile');
          console.log('module-hello', spec ?? 'bundle');
          "
      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DESKTOP_SMOKE_STATUS: ${{ job.status }}
        run: node scripts/desktop-smoke/collect.mjs
      - name: Stop Desktop
        if: always()
        continue-on-error: true
        shell: pwsh
        run: Get-Process | Where-Object { $_.ProcessName -like '*DeepSeek*' } | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Publish logs
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name ci
          git config user.email ci@example.com
          shopt -s nullglob
          files=(desktop-${{ inputs.label }}*.png desktop-${{ inputs.label }}*.txt desktop-${{ inputs.label }}*.json desktop-${{ inputs.label }}*.log)
          if [ ${#files[@]} -gt 0 ]; then
            git add -f "${files[@]}"
            git commit -m "ci: windows desktop smoke log [skip ci]" || true
          fi
          git push origin HEAD:desktop-ui-log-${{ inputs.label }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: desktop-smoke-windows-${{ inputs.label }}
          if-no-files-found: warn
          path: |
            desktop-${{ inputs.label }}*.png
            desktop-${{ inputs.label }}*.txt
            desktop-${{ inputs.label }}*.json
            desktop-${{ inputs.label }}*.log

